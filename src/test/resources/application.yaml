spring:
  application:
    name: FilsoftCreditSolutionProject

  # Baza de date H2 in-memory folosita doar la teste.
  # Modul PostgreSQL pentru compatibilitate cu tipurile folosite (UUID etc.)
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      # Recreeaza schema la fiecare rulare de teste
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: false

